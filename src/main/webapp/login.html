<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Vehicle Rental System</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <div class="brand-icon">
                <svg viewBox="0 0 24 24"><path d="M18.92 6.01C18.72 5.42 18.16 5 17.5 5h-11c-.66 0-1.21.42-1.42 1.01L3 12v8c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-1h12v1c0 .55.45 1 1 1h1c.55 0 1-.45 1-1v-8l-2.08-5.99zM6.5 16c-.83 0-1.5-.67-1.5-1.5S5.67 13 6.5 13s1.5.67 1.5 1.5S7.33 16 6.5 16zm11 0c-.83 0-1.5-.67-1.5-1.5s.67-1.5 1.5-1.5 1.5.67 1.5 1.5-.67 1.5-1.5 1.5zM5 11l1.5-4.5h11L19 11H5z"/></svg>
            </div>
            <span>AutoRent</span>
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="vehicles.html">Vehicles</a></li>
        </ul>
        <div class="nav-auth" id="navAuth">
            <a href="register.html" class="btn btn-primary btn-sm">Register</a>
        </div>
    </nav>

    <main class="container" style="max-width: 480px; margin-top: 2rem;">
        
        <div id="feedbackMessage"></div>

        <div class="card">
            <h2 class="card-title" style="text-align: center;">Account Login</h2>
            <p style="text-align: center; color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.95rem;">
                Sign in to manage bookings or browse vehicles
            </p>

            <form action="login" method="POST" id="loginForm">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-control" required placeholder="Enter username" autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-control" required placeholder="Enter password" autocomplete="current-password">
                </div>

                <button type="submit" id="loginBtn" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
                    Sign In
                </button>
            </form>

            <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--text-secondary);">
                Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600;">Register here</a>
            </div>

            <!-- Demo Credentials Quick Fill Helpers -->
            <div style="margin-top: 2rem; padding: 1rem; background: var(--bg-card-subtle); border-radius: var(--radius-md); border: 1px dashed var(--border-color);">
                <p style="font-size: 0.8rem; font-weight: 700; color: var(--text-secondary); margin-bottom: 0.5rem; text-transform: uppercase;">Quick Demo Autofill:</p>
                <div style="display: flex; gap: 0.5rem;">
                    <button type="button" class="btn btn-secondary btn-sm" id="fillCustomerBtn" style="flex: 1;" onclick="fillDemo('customer', 'customer123')">
                        Customer
                    </button>
                    <button type="button" class="btn btn-secondary btn-sm" id="fillAdminBtn" style="flex: 1;" onclick="fillDemo('admin', 'admin123')">
                        Admin
                    </button>
                </div>
            </div>
        </div>

    </main>

    <footer class="footer">
        <div class="footer-content">
            <p>Vehicle Rental Management System &bull; Java Servlet & XML Data Store</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
    <script>
        function fillDemo(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
        }
    </script>
</body>
</html>
